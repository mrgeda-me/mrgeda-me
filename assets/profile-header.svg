<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">MrGeda · A Personal Space</title>
  <desc id="desc">A bright, open blue-sky landscape with soft clouds and distant mountains.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69B8F2"/>
      <stop offset=".58" stop-color="#B9E1F8"/>
      <stop offset="1" stop-color="#EDF8FC"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE5F5"/>
      <stop offset="1" stop-color="#F7FCFE"/>
