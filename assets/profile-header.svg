    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ABDDD"/>
      <stop offset="1" stop-color="#B7D9E9"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#FFFDF3" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFDF3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
